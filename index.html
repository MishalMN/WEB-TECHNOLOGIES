<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📚 Student Manager</h1>

<!-- Dark Mode Button -->
<div style="text-align:center;">
    <button id="theme-toggle">🌙 Dark Mode</button>
</div>

<div class="container">

    <!-- Form -->
    <form id="form">
        <input type="text" id="roll" placeholder="Roll Number">
        <input type="text" id="name" placeholder="Student Name">
        <button type="submit" id="add" disabled>Add</button>
    </form>

    <!-- Search -->
    <input type="text" id="search" placeholder="🔍 Search student...">

    <!-- Buttons -->
    <div class="controls">
        <button id="sort">Sort A-Z</button>
        <button id="top">Top Student</button>
        <button id="highlightAll">Highlight</button>
    </div>

    <!-- List -->
    <ul id="list"></ul>

    <!-- Info -->
    <p id="total">Total: 0</p>
    <p id="attendance">Present: 0 | Absent: 0</p>

</div>

<script src="app.js"></script>
</body>
</html>
